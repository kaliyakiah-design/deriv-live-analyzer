<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deriv Matches/Differs Analyzer</title>
<style>
body{background:#071426;color:white;font-family:Arial;padding:15px}
.card{background:#0d2035;padding:16px;margin:12px 0;border-radius:14px}
select,button{width:100%;padding:13px;margin:6px 0;border-radius:9px}
button{background:#55a0ff;border:0;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:#09182a;padding:12px;border-radius:9px}
.big{font-size:22px;font-weight:bold}
.good{color:#39df91}.warn{color:#ffd166}.bad{color:#ff7070}
</style>
</head>

<body>
<h2>Deriv Matches / Differs</h2>

<div class="card">
<div id="status">🔴 Disconnected</div>
<div id="info">Ready</div>

<select id="market">
<option value="R_10">Volatility 10</option>
<option value="R_25">Volatility 25</option>
<option value="R_50" selected>Volatility 50</option>
<option value="R_75">Volatility 75</option>
<option value="R_100">Volatility 100</option>
<option value="1HZ10V">Volatility 10 (1s)</option>
<option value="1HZ25V">Volatility 25 (1s)</option>
<option value="1HZ50V">Volatility 50 (1s)</option>
<option value="1HZ75V">Volatility 75 (1s)</option>
<option value="1HZ100V">Volatility 100 (1s)</option>
</select>

<select id="window">
<option>25</option>
<option>50</option>
<option selected>100</option>
<option>250</option>
</select>

<select id="digit"></select>

<button onclick="connect()">CONNECT & ANALYZE</button>
<button onclick="stop()">DISCONNECT</button>
</div>

<div class="card">
<div class="grid">
<div class="box">Ticks<div id="ticks" class="big">0</div></div>
<div class="box">Current Digit<div id="current" class="big">-</div></div>
<div class="box">Match<div id="match" class="big">-</div></div>
<div class="box">Differ<div id="diff" class="big">-</div></div>
</div>
</div>

<div class="card">
<h3 id="signal">NO CLEAR SETUP</h3>
<div id="reason">Waiting for data...</div>
</div>

<div class="card">
<b>Last digits</b>
<div id="history">-</div>
</div>

<script>
const $=x=>document.getElementById(x);

for(let i=0;i<10;i++){
 let o=document.createElement("option");
 o.value=i;
 o.textContent="Target digit: "+i;
 $("digit").appendChild(o);
}

let ws=null;
let data=[];
let count=0;
let timer=null;

function connect(){
 stop();
 data=[];
 count=0;
 render();

 let s=$("market").value;
 $("status").textContent="🟡 Connecting...";
 $("info").textContent="Connecting to Deriv...";

 try{
  ws=new WebSocket(
   "wss://ws.binaryws.com/websockets/v3"
  );

  ws.onopen=function(){
   $("status").textContent="🟢 Connected";
   $("info").textContent="Receiving "+s;

   ws.send(JSON.stringify({
    ticks_history:s,
    count:250,
    end:"latest",
    style:"ticks",
    req_id:1
   }));

   ws.send(JSON.stringify({
    ticks:s,
    subscribe:1,
    req_id:2
   }));
  };

  ws.onmessage=function(e){
   let d=JSON.parse(e.data);

   if(d.error){
    $("info").textContent="API: "+d.error.message;
    return;
   }

   if(d.msg_type==="history"){
    data=(d.history.prices||[]).map(lastDigit);
    render();
   }

   if(d.msg_type==="tick"){
    let x=lastDigit(d.tick.quote);
    if(x>=0){
     data.push(x);
     if(data.length>500)data.shift();
     count++;
     render();
    }
   }
  };

  ws.onerror=function(){
   $("status").textContent="🔴 Connection error";
   $("info").textContent="WebSocket error";
  };

  ws.onclose=function(){
   $("status").textContent="🔴 Disconnected";
  };

 }catch(e){
  $("info").textContent=e.message;
 }
}

function lastDigit(x){
 let s=String(x).replace(/[^0-9]/g,"");
 return s.length?Number(s.slice(-1)):-1;
}

function render(){
 let n=Number($("window").value);
 let a=data.slice(-n);
 let t=Number($("digit").value);

 $("ticks").textContent=data.length;
 $("current").textContent=a.length?a[a.length-1]:"-";
 $("history").textContent=a.slice(-80).join(" ");

 if(!a.length){
  $("match").textContent="-";
  $("diff").textContent="-";
  return;
 }

 let m=a.filter(x=>x===t).length;
 let mp=m/a.length*100;
 let dp=100-mp;

 $("match").textContent=mp.toFixed(1)+"%";
 $("diff").textContent=dp.toFixed(1)+"%";

 signal(mp,a.length);
}

function signal(mp,n){
 let s="NO CLEAR SETUP";
 let r="Not enough statistical evidence.";

 if(n>=25 && mp>=15){
  s="MATCH ANOMALY";
  r="Target digit is unusually frequent.";
 }
 else if(n>=25 && mp<=7){
  s="DIFFER ANOMALY";
  r="Target digit is unusually rare.";
 }
 else{
  r="Target is close to the normal 10% baseline.";
 }

 $("signal").textContent=s;
 $("reason").textContent=r+" Baseline = 10%.";
}

function stop(){
 if(ws){
  try{ws.close()}catch(e){}
  ws=null;
 }
 clearTimeout(timer);
 $("status").textContent="🔴 Disconnected";
}

$("market").onchange=render;
$("window").onchange=render;
$("digit").onchange=render;
render();
</script>
</body>
</html>
